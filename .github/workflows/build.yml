name: PS3 SDK Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout build scripts
        uses: actions/checkout@v6
        with:
          repository: ps3dev/ps3toolchain
          path: ps3toolchain

      - name: Set env vars
        id: slug
        run: |
          echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV
          echo "NO_SAVANNAH=1" >> $GITHUB_ENV

      - name: Install Linux requirements
        run: |
          sudo apt-get -y install gcc libelf-dev autoconf automake bison flex make texinfo patch wget zlib1g-dev libtool-bin bzip2 pkg-config libssl-dev

      - name: Download PS3DEV Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOOLCHAIN_URL=$(gh api repos/ps3dev/ps3toolchain/releases \
            --jq '
              map(select(.prerelease and (.draft | not)))
              | sort_by(.published_at)
              | reverse
              | .[0].assets[]
              | select(.name == "ps3dev-linux-${{ runner.arch }}.tar.gz")
              | .browser_download_url
            ')

          curl -sL "$TOOLCHAIN_URL" | tar xvz -C ./
          echo "PS3DEV=${GITHUB_WORKSPACE}/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=${GITHUB_WORKSPACE}/ps3dev" >> $GITHUB_ENV
          echo "PATH=$PATH:$PWD/ps3dev/bin:$PWD/ps3dev/ppu/bin:$PWD/ps3dev/spu/bin" >> $GITHUB_ENV

      - name: Build PSL1GHT
        run: |
          ./build-all.sh 2

      - name: Build libraries
        run: |
          ./build-all.sh 3

      - name: Build Package
        run: |
           tar -zcvf ps3dev-linux-${{ runner.arch }}.tar.gz ps3dev/

      - name: Push package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ps3dev-${{ env.sha_name }}-linux-${{ runner.arch }}
          path: ps3dev-linux-${{ runner.arch }}.tar.gz
          if-no-files-found: error

  push_release:
    if: |
      github.event_name == 'push' &&
      github.repository == 'ps3dev/ps3dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly-$(date -u +%Y-%m-%d)"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" artifacts/*.tar.gz --target ${{ GITHUB.SHA }} -t "$TAG" --prerelease
