name: Temporary OpenMoHAA host parser tools

on:
  push:
    branches:
      - chatgpt/openmohaa-host-tools-20261015
    paths:
      - .github/workflows/openmohaa-host-tools.yml

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install host generators and bundle their non-core runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bison flex m4 python3
          mkdir -p /tmp/host-tools/bin /tmp/host-tools/lib /tmp/host-tools/share
          cp /usr/bin/bison /usr/bin/flex /usr/bin/m4 /tmp/host-tools/bin/
          cp -a /usr/share/bison /tmp/host-tools/share/
          if [ -d /usr/share/flex ]; then cp -a /usr/share/flex /tmp/host-tools/share/; fi
          python3 - <<'PY'
          import shutil, subprocess
          from pathlib import Path

          root = Path("/tmp/host-tools")
          core_prefixes = (
              "libc.so", "libm.so", "libpthread.so", "libdl.so", "librt.so",
              "libresolv.so", "libgcc_s.so", "libstdc++.so", "libatomic.so",
              "ld-linux",
          )
          pending = [Path("/usr/bin/bison"), Path("/usr/bin/flex"), Path("/usr/bin/m4")]
          seen = set()
          while pending:
              binary = pending.pop().resolve()
              if binary in seen:
                  continue
              seen.add(binary)
              proc = subprocess.run(["ldd", str(binary)], text=True, capture_output=True, check=False)
              for line in proc.stdout.splitlines():
                  dep_text = None
                  if "=>" in line:
                      right = line.split("=>", 1)[1].strip().split()
                      if right and right[0].startswith("/"):
                          dep_text = right[0]
                  else:
                      fields = line.strip().split()
                      if fields and fields[0].startswith("/"):
                          dep_text = fields[0]
                  if not dep_text:
                      continue
                  dep = Path(dep_text).resolve()
                  if not dep.is_file() or dep.name.startswith(core_prefixes):
                      continue
                  dest = root / "lib" / dep.name
                  if not dest.exists():
                      shutil.copy2(dep, dest)
                  pending.append(dep)
          PY
          printf 'bison: '; /usr/bin/bison --version | head -1
          printf 'flex: '; /usr/bin/flex --version
          printf 'm4: '; /usr/bin/m4 --version | head -1
          tar -czf /tmp/openmohaa-host-tools.tar.gz -C /tmp host-tools

      - uses: actions/upload-artifact@v7
        with:
          name: openmohaa-host-parser-tools-20261015b
          path: /tmp/openmohaa-host-tools.tar.gz
          if-no-files-found: error
          retention-days: 3
